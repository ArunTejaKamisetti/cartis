# Render Blueprint: New > Blueprint > pick this repo. Secrets are entered in the dashboard (sync: false).
services:
  - type: web
    name: cartis
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn cartis.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CARTIS_MODEL
        value: claude-sonnet-5-5
      - key: CARTIS_ORDER_EMAIL
        value: send
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GNANI_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: CARTIS_SHEET_ID
        sync: false
      - key: GOOGLE_TOKEN_JSON
        sync: false
      - key: DEMO_PASSCODE
        sync: false
